name: BrainRot
options:
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BrainRot:
    type: application
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    platform: iOS
    sources:
      - path: BrainRot
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BRAINROT_BUNDLE_ID_PREFIX).brainrot
        INFOPLIST_FILE: BrainRot/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
